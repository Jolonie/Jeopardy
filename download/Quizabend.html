<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizabend · Jeopardy</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#f4f3fa;background:#10101b;color-scheme:dark;--accent:#c7f569;--muted:#a4a3b6}*{box-sizing:border-box}body{margin:0}header{height:88px;border-bottom:1px solid #30303e;display:flex;align-items:center;gap:30px;padding:0 5vw}.brand{font-weight:900;letter-spacing:2px;text-decoration:none;color:white}.brand span{color:var(--accent)}.tag{color:var(--muted);font-size:13px}header button{margin-left:auto}main{max-width:1400px;margin:auto;padding:48px 5vw}h1{font-size:clamp(30px,4vw,52px);letter-spacing:-2px;margin:8px 0 16px}h2{font-size:22px}p{color:var(--muted);line-height:1.6}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px}.steps{display:flex;gap:12px;margin:32px 0}.steps span{padding:10px 16px;border-radius:30px;background:#21212f;color:var(--muted);font-size:13px}.steps .active{background:var(--accent);color:#182012}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:12px 18px;background:var(--accent);color:#182012;font-weight:750}button:hover{filter:brightness(1.1)}button:disabled{opacity:.4;cursor:default}.quiet{background:#292938;color:white}.danger{background:#743645;color:#fff}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}input,textarea,select{width:100%;border:1px solid #414153;border-radius:8px;background:#161622;color:#fff;padding:12px;margin-top:7px}textarea{resize:vertical;min-height:80px}label{display:block;color:#c5c4d1;font-size:13px}.categories{display:grid;gap:18px}.category,.panel{background:#1c1c29;border:1px solid #343443;border-radius:16px;padding:24px}.category summary{cursor:pointer;font-weight:750}.questions{display:grid;gap:20px;margin-top:24px}.question-row{display:grid;grid-template-columns:72px 1fr 1fr;gap:16px;align-items:start}.points{color:var(--accent);font-weight:850;padding-top:30px}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:30px 0}.heading{text-align:center;overflow-wrap:anywhere;background:#29283b;padding:18px 8px;border-radius:10px;font-weight:750}.tile{background:#33305c;color:#d4cbff;font-size:clamp(20px,3vw,40px);min-height:100px}.tile:disabled{background:#1b1b27;color:#777;opacity:.6}.scorecard{background:#1e1e2d;border:1px solid #363646;border-radius:12px;padding:18px;overflow-wrap:anywhere}.score{font-size:32px;color:var(--accent);font-weight:800;margin:12px 0}.scorecard form{display:flex;gap:6px}.scorecard input{min-width:0;margin:0}.scorecard button{padding:10px}dialog{width:min(700px,94vw);max-height:90vh;overflow:auto;background:#222231;color:#fff;border:1px solid #555168;border-radius:20px;padding:32px}dialog::backdrop{background:#06060bd9}dialog h2{font-size:30px;white-space:pre-wrap;overflow-wrap:anywhere}.answer{background:#303043;padding:18px;border-radius:10px;white-space:pre-wrap}#notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#15200c;padding:14px 22px;border-radius:12px;max-width:90vw}#notice:empty{display:none}.hint{font-size:13px}.history{max-height:220px;overflow:auto;color:var(--muted);font-size:13px;line-height:1.8}@media(min-width:1000px){.categories{grid-template-columns:1fr 1fr}.category:last-child{grid-column:1/-1}}@media(max-width:600px){header{gap:10px;padding:0 16px}.tag{display:none}main{padding:28px 16px}.question-row{grid-template-columns:40px 1fr}.question-row label:last-child{grid-column:2}.board{gap:5px}.heading{font-size:11px;padding:14px 3px}.tile{min-height:72px;padding:6px}.steps span{font-size:11px;padding:9px}.category{padding:16px}dialog{padding:22px}}

.scorecard form{display:grid;gap:10px}.scorecard label{min-width:0}.scorecard input{margin-top:7px}.score-error{color:#ffb8c3;font-size:13px}.winner{text-align:center;padding:32px 0 48px}.trophy{font-size:80px}.winner h2{color:var(--accent);font-size:32px;overflow-wrap:anywhere}.ranking{padding:0;list-style:none}.ranking li{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid #343443}.ranking li:first-child{color:var(--accent)}

.turn-indicator{background:#252e20;border:1px solid #6c8443;border-radius:12px;padding:16px;color:var(--accent)}.turn-indicator span{color:var(--muted);font-size:13px}.current-team{border-color:var(--accent)}.score-error{overflow-wrap:anywhere}

<body><header><a href="./" class="brand">QUIZ<span>ABEND</span></a><span class="tag">Version 1.7 · Quizabend</span><button id="reset" class="quiet">Spiel abbrechen</button></header><main id="app"></main><dialog id="question"></dialog><dialog id="team-manager" aria-labelledby="team-manager-title"></dialog><dialog id="abort-game" aria-labelledby="abort-title" aria-describedby="abort-description"><h2 id="abort-title">Komplettes Spiel abbrechen?</h2><p id="abort-description">Alle Kategorien, Fragen, Teams und Punkte dieses Spiels werden gelöscht. Du kehrst zur Startseite zurück.</p><div class="actions"><button type="button" id="keep-playing" class="quiet" autofocus>Weiterspielen</button><button type="button" id="confirm-abort" class="danger">Ja, Spiel abbrechen</button></div></dialog><div id="notice" role="status" aria-live="polite"></div><script>function answerPoints(value, correct) {
  return correct ? value : -value / 2;
}

function advanceTurn(current, teamCount) {
  return (current + 1) % teamCount;
}

function skipBoard(state) {
  for (const category of state.categories) {
    for (const question of category.questions) {
      if (!question.used) {
        question.used = true;
        question.skipped = true;
      }
    }
  }
}

function applyTeamChanges(state, entries) {
  if (state.phase !== 'game' || state.categories.some(c => c.questions.some(q => !q.used))) throw new Error('Teams können erst nach Abschluss des Boards geändert werden.');
  if (entries.length < 2) throw new Error('Mindestens zwei Teams müssen im Spiel bleiben.');
  const names = entries.map(t => t.name.trim());
  if (names.some(name => !name)) throw new Error('Bitte für jedes Team einen Namen eingeben.');
  if (new Set(names.map(name => name.toLowerCase())).size !== names.length) throw new Error('Teamnamen müssen eindeutig sein.');
  const sources = entries.filter(t => t.source !== undefined).map(t => t.source);
  if (new Set(sources).size !== sources.length || sources.some(i => !Number.isInteger(i) || !state.teams[i])) throw new Error('Ungültige Teamzuordnung. Bitte die Teamverwaltung erneut öffnen.');
  const teams = entries.map((t,i) => ({name:names[i],score:t.source === undefined ? 0 : state.teams[t.source].score}));
  let turn = 0;
  for (let offset = 0; offset < state.teams.length; offset++) {
    const next = ((state.turn || 0) + offset) % state.teams.length;
    const index = entries.findIndex(t => t.source === next);
    if (index !== -1) { turn = index; break; }
  }
  const changed = entries.length !== state.teams.length || entries.some((t,i) => t.source !== i || names[i] !== state.teams[i].name);
  if (changed) state.history = [];
  state.teams = teams;
  state.turn = turn;
}

function correctionDelta(score, input, mode) {
  const text = String(input).trim().replaceAll('−', '-');
  if (!/^[+-]?\d+$/.test(text)) throw new Error('Bitte eine ganze Zahl eingeben, z. B. 100 oder −100.');
  const value = Number(text);
  if (!Number.isSafeInteger(value)) throw new Error('Die eingegebene Punktzahl ist zu groß.');
  if (mode === 'set') return value - score;
  if (mode === 'subtract') return -Math.abs(value);
  if (mode === 'add') return value;
  throw new Error('Bitte eine gültige Korrekturart wählen.');
}

function nextRound(state) {
  state.round = (state.round || 1) + 1;
  state.phase = 'questions';
  state.categories = Array.from({length:5}, () => ({name:'', questions:Array.from({length:5}, () => ({text:'',answer:'',used:false}))}));
  state.history = [];
}

function standings(teams) {
  return teams.map(t => ({...t})).sort((a,b) => b.score-a.score)
    .map((t,i,sorted) => ({...t,rank:sorted.findIndex(other => other.score === t.score)+1}));
}

function parseQuiz(text) {
  const categories = [];
  let category, question;
  const fail = (line, message) => { throw new Error(`Zeile ${line}: ${message}`); };
  for (const [index, raw] of text.replace(/^\uFEFF/, '').split(/\r?\n/).entries()) {
    const line = raw.trim();
    if (!line) continue;
    const match = /^(Kategorie|Punkte|Frage|Antwort):\s*(.*)$/i.exec(line);
    if (!match) fail(index + 1, 'Erwartet wird Kategorie:, Punkte:, Frage: oder Antwort:. Jede Angabe gehört in eine eigene Zeile.');
    const [, label, value] = match;
    if (!value) fail(index + 1, 'Die Angabe darf nicht leer sein.');
    switch (label.toLowerCase()) {
      case 'kategorie':
        category = {name: value, questions: []};
        categories.push(category);
        question = null;
        break;
      case 'punkte': {
        if (!category) fail(index + 1, 'Zuerst eine Kategorie angeben.');
        const expected = (category.questions.length + 1) * 100;
        if (expected > 500 || value !== String(expected)) fail(index + 1, 'Pro Kategorie Punkte in dieser Reihenfolge angeben: 100, 200, 300, 400, 500.');
        question = {text: '', answer: '', used: false};
        category.questions.push(question);
        break;
      }
      default: {
        if (!question) fail(index + 1, 'Vor jeder Frage zuerst Punkte: angeben.');
        const field = label.toLowerCase() === 'frage' ? 'text' : 'answer';
        if (question[field]) fail(index + 1, 'Frage oder Antwort für diesen Punktewert ist doppelt vorhanden.');
        question[field] = value;
      }
    }
  }
  const error = validateSetup(categories, [{name: 'A'}, {name: 'B'}]);
  if (error) throw new Error(error);
  return categories;
}

function quizTemplate() {
  return Array.from({length: 5}, (_, i) => `Kategorie: Kategorie ${i + 1}\n\n` +
    Array.from({length: 5}, (_, j) => `Punkte: ${(j + 1) * 100}\nFrage: Hier Frage ${j + 1} eingeben\nAntwort: Hier Lösung ${j + 1} eingeben`).join('\n\n')).join('\n\n');
}

function adjustScore(team, delta) {
  if (!Number.isSafeInteger(delta) || !Number.isSafeInteger(team.score + delta)) throw new Error('Bitte eine gültige ganze Punktzahl eingeben.');
  team.score += delta;
}
function validateSetup(categories, teams) {
  if (categories.length !== 5 || categories.some(c => !c.name.trim() || c.questions.length !== 5 || c.questions.some(q => !q.text.trim() || !q.answer.trim()))) return 'Bitte alle fünf Kategorien und alle 25 Fragen mit Lösung ausfüllen.';
  if (teams.length < 2 || teams.some(t => !t.name.trim())) return 'Bitte mindestens zwei Teams mit Namen anlegen.';
  if (new Set(teams.map(t => t.name.trim().toLowerCase())).size !== teams.length) return 'Teamnamen müssen eindeutig sein.';
  return '';
}

const key='quizabend-v1';
const fresh=()=>({phase:'questions',round:1,turn:0,categories:Array.from({length:5},()=>({name:'',questions:Array.from({length:5},()=>({text:'',answer:'',used:false}))})),teams:Array.from({length:10},(_,i)=>({name:`Team ${i+1}`,score:0})),history:[]});
let state;try{state=JSON.parse(localStorage.getItem(key))||fresh();if(!['questions','teams','game','winner'].includes(state.phase)||!Array.isArray(state.categories)||!Array.isArray(state.teams))state=fresh()}catch{state=fresh()}
state.round ||= 1;
if(!Number.isInteger(state.turn)||state.turn<0||state.turn>=state.teams.length)state.turn=state.categories.flatMap(c=>c.questions).filter(q=>q.used).length%state.teams.length;
const factor=()=>state.round>1?2:1;
const app=document.querySelector('#app'),dialog=document.querySelector('#question');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let timer;function notify(msg){document.querySelector('#notice').textContent=msg;clearTimeout(timer);timer=setTimeout(()=>document.querySelector('#notice').textContent='',4500)}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{notify('Speichern im Browser fehlgeschlagen. Bitte Browser-Speicher prüfen.')}}
function steps(){return `<div class="steps">${['Fragen vorbereiten','Teams anlegen','Spielen'].map((x,i)=>`<span class="${['questions','teams','game'][i]===state.phase?'active':''}">${i+1} · ${x}</span>`).join('')}</div>`}
function render(){
 if(state.phase==='questions')app.innerHTML=`<div class="eyebrow">DEIN ABEND, DEINE FRAGEN</div><h1>${state.round>1?`Board ${state.round} vorbereiten.`:"Das Spiel beginnt mit dir."}</h1>${state.round>1?'<p>Teams und Punkte bleiben erhalten. Dieses Board zählt doppelt: 200–1.000 Punkte. Die TXT-Datei verwendet weiterhin die Stufen 100–500; die Verdopplung erfolgt automatisch.</p>':''}<p>Fünf Kategorien, fünf Schwierigkeitsstufen, 25 Chancen zu glänzen.<br>Trage für jedes Feld eine Frage und die passende Lösung ein.</p>${steps()}<section class="panel" style="margin-bottom:24px"><h2>25 Fragen auf einmal importieren</h2><p>Vorlage herunterladen, ausfüllen und als UTF-8-TXT laden – oder den Text hier einfügen. Der Import ersetzt nach Bestätigung alle Kategorien und Fragen.</p><div class="actions"><button id="template" class="quiet">TXT-Vorlage herunterladen</button><label>TXT-Datei auswählen<input id="quiz-file" type="file" accept=".txt,text/plain"></label></div><details><summary>Text einfügen & Format ansehen</summary><p class="hint">Genau fünf Kategorien mit je fünf Blöcken für 100, 200, 300, 400 und 500 Punkte. Jede Angabe in einer eigenen Zeile; Leerzeilen sind frei wählbar.</p><pre>Kategorie: Allgemeinwissen

Punkte: 100
Frage: Wie heißt die Hauptstadt von Frankreich?
Antwort: Paris</pre><label>Vollständiger Quiztext<textarea id="quiz-text" rows="10" placeholder="Kategorie: …"></textarea></label><div class="actions"><button id="import-text">Text importieren</button></div></details><p id="import-error" role="alert" style="color:#ffb8c3"></p></section><div class="categories">${state.categories.map((c,i)=>`<details class="category" open><summary>Kategorie ${i+1}</summary><label style="margin-top:20px">Kategoriename<input maxlength="80" data-cat="${i}" value="${esc(c.name)}" placeholder="z. B. Wissen & Wunder"></label><div class="questions">${c.questions.map((q,j)=>`<div class="question-row"><div class="points">${(j+1)*100*factor()}</div><label>Frage · Stufe ${j+1}<textarea data-c="${i}" data-q="${j}" data-field="text" placeholder="Deine Frage …">${esc(q.text)}</textarea></label><label>Lösung<textarea data-c="${i}" data-q="${j}" data-field="answer" placeholder="Die richtige Antwort …">${esc(q.answer)}</textarea></label></div>`).join('')}</div></details>`).join('')}</div><div class="actions"><button id="next">${state.round>1?"Neues Board starten →":"Weiter zu den Teams →"}</button></div><p class="hint">Automatisch lokal gespeichert. Fragen und Lösungen sind nur für die Spielleitung gedacht.</p>`;
 else if(state.phase==='teams')app.innerHTML=`<div class="eyebrow">GEMEINSAM RÄTSELN</div><h1>Wer ist heute dabei?</h1><p>Zehn Teams sind vorbereitet. Du kannst Teams hinzufügen oder entfernen; mindestens zwei müssen mitspielen.</p>${steps()}<div class="teams">${state.teams.map((t,i)=>`<div class="panel"><label>Team ${i+1}<input data-team="${i}" maxlength="60" value="${esc(t.name)}"></label><button class="quiet" data-remove="${i}" style="margin-top:12px" ${state.teams.length<=2?'disabled':''}>Entfernen</button></div>`).join('')}</div><div class="actions"><button class="quiet" id="add">+ Team hinzufügen</button><button class="quiet" id="back">← Fragen bearbeiten</button><button id="start">Spiel starten →</button></div>`;
 else if(state.phase==='winner')renderWinner();
 else renderGame();
}
function renderGame(){const left=state.categories.flatMap(c=>c.questions).filter(q=>!q.used).length;app.innerHTML=`<div class="eyebrow">BOARD ${state.round} · ${factor()===2?"DOPPELTE PUNKTE":"DIE BÜHNE GEHÖRT EUCH"}</div><h1>${left?'Wählt eure nächste Herausforderung.':'Board abgeschlossen!'}</h1><p>${left?`${left} von 25 Fragen offen · Bedienung durch eine Spielleitung`:'Board abgeschlossen · Endstand unten'}</p>${left?`<p class="turn-indicator">Am Zug: <strong>${esc(state.teams[state.turn].name)}</strong> <span>· Team bei jeder Frage änderbar</span></p>`:''}<div class="board">${state.categories.map(c=>`<div class="heading">${esc(c.name)}</div>`).join('')}${Array.from({length:5},(_,j)=>state.categories.map((c,i)=>`<button class="tile" data-open="${i},${j}" ${c.questions[j].used?'disabled':''} aria-label="${esc(c.name)}, ${(j+1)*100*factor()} Punkte">${c.questions[j].used?(c.questions[j].skipped?'–':'✓'):(j+1)*100*factor()}</button>`).join('')).join('')}</div>${left?'<div class="actions"><button type="button" id="skip-board" class="quiet">Board überspringen (Test)</button><span class="hint">Schließt alle offenen Fragen ohne Punktevergabe.</span></div>':''}${left?'':'<section class="panel"><h2>Wie geht es weiter?</h2><p>Mit neuen Fragen weiterspielen oder jetzt den Sieger küren.</p><div class="actions"><button id="new-board">Neues Board vorbereiten →</button><button id="finish">Spiel beenden & Sieger anzeigen</button><button id="manage-teams" class="quiet">Teams verwalten</button></div></section>'}<h2>Teams & Punktestand</h2><p class="hint">Richtig: Punkte dazu. Falsch: die Hälfte der Punkte abziehen. Manuelle Korrektur: z. B. 100 oder −100 eingeben.</p><div class="teams">${state.teams.map((t,i)=>`<section class="scorecard ${i===state.turn?'current-team':''}"><strong>${esc(t.name)}</strong><div class="score">${t.score} <small>Pkt.</small></div><form data-score="${i}" novalidate><label>Korrekturart<select name="mode" aria-label="Korrekturart für ${esc(t.name)}"><option value="add">Punkte hinzufügen (+/−)</option><option value="subtract">Punkte abziehen</option><option value="set">Punktestand setzen</option></select></label><label>Punkte<input type="text" name="amount" required placeholder="z. B. 100 oder −100" aria-label="Punktekorrektur für ${esc(t.name)}"></label><button type="button" data-apply-score="${i}">Übernehmen</button><span class="score-error" role="alert"></span></form></section>`).join('')}</div><div class="actions"><button id="undo" class="quiet" ${state.history.length?'':'disabled'}>Letzte Änderung rückgängig</button></div><details><summary>Punkteverlauf</summary><div class="history">${state.history.slice().reverse().map(h=>`<div>${esc(h.label)}</div>`).join('')||'Noch keine Änderungen.'}</div></details>`}
app.addEventListener('input',e=>{const d=e.target.dataset;if(d.cat!==undefined)state.categories[+d.cat].name=e.target.value;if(d.field)state.categories[+d.c].questions[+d.q][d.field]=e.target.value;if(d.team!==undefined)state.teams[+d.team].name=e.target.value;save()});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.applyScore!==undefined){applyCorrection(b.closest('form'));return}if(b.id==='manage-teams'){openTeamManager();return}if(b.id==='skip-board'){skipBoard(state);save();render();return}if(b.id==='new-board'){nextRound(state);save();render();return}if(b.id==='finish'){state.phase='winner';save();render();return}if(b.id==='return-board'){state.phase='game';save();render();return}if(b.id==='template'){downloadTemplate();return}if(b.id==='import-text'){importQuiz(document.querySelector('#quiz-text').value);return}if(d.open){openQuestion(...d.open.split(',').map(Number));return}if(d.remove!==undefined)state.teams.splice(+d.remove,1);else if(b.id==='add')state.teams.push({name:`Team ${state.teams.length+1}`,score:0});else if(b.id==='back')state.phase='questions';else if(b.id==='next'){const error=validateSetup(state.categories,[{name:'A'},{name:'B'}]);if(error)return notify(error);state.phase=state.round>1?'game':'teams'}else if(b.id==='start'){const error=validateSetup(state.categories,state.teams);if(error)return notify(error);state.phase='game'}else if(b.id==='undo'){const h=state.history.pop();if(h){state.teams[h.team].score=h.previous;if(Number.isInteger(h.previousTurn))state.turn=h.previousTurn;if(h.question)state.categories[h.question[0]].questions[h.question[1]].used=false}}else return;save();render()});
app.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.dataset.score!==undefined)applyCorrection(e.target);
});
app.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.name==='amount'){
  e.preventDefault();applyCorrection(e.target.closest('form'));
 }
});
function applyCorrection(form){
 const i=Number(form.dataset.score);
 try{
  const previous=state.teams[i].score;
  const mode=form.querySelector('[name="mode"]').value;
  const delta=correctionDelta(previous,form.querySelector('[name="amount"]').value,mode);
  adjustScore(state.teams[i],delta);
  state.history.push({team:i,previous,label:`${state.teams[i].name}: ${delta>=0?'+':''}${delta} Punkte (manuell)`});
  const message=`${state.teams[i].name}: ${previous} → ${state.teams[i].score} Punkte`;
  save();
  // Update only this card: keep scroll position and the entered correction mode.
  form.closest('.scorecard').querySelector('.score').innerHTML=`${state.teams[i].score} <small>Pkt.</small>`;
  form.querySelector('[name="amount"]').value='';
  form.querySelector('.score-error').textContent=message;
  document.querySelector('#undo').disabled=false;
  document.querySelector('.history').innerHTML=state.history.slice().reverse().map(h=>`<div>${esc(h.label)}</div>`).join('');
  notify(message);
 }catch(err){form.querySelector('.score-error').textContent=err.message}
}

function renderWinner(){
 const ranked=standings(state.teams),winners=ranked.filter(t=>t.rank===1);
 app.innerHTML=`<section class="winner"><div class="eyebrow">QUIZABEND · ENDERGEBNIS</div><div class="trophy" aria-hidden="true">🏆</div><h1>${winners.length>1?'Gemeinsamer Sieg!':'Wir haben ein Siegerteam!'}</h1><h2>${winners.map(t=>esc(t.name)).join(' & ')}</h2><p>${ranked[0].score} Punkte · ${state.round} ${state.round===1?'Board':'Boards'}</p></section><section class="panel"><h2>Die Abschlusstabelle</h2><ol class="ranking">${ranked.map(t=>`<li><span>${t.rank}. ${esc(t.name)}</span><strong>${t.score} Pkt.</strong></li>`).join('')}</ol></section><div class="actions"><button id="return-board" class="quiet">Zurück zum Board / Punkte korrigieren</button><button id="new-board">Mit einem neuen Board weiterspielen</button></div>`;
}

function openQuestion(i,j){const q=state.categories[i].questions[j];dialog.innerHTML=`<div class="eyebrow">${esc(state.categories[i].name)} · ${(j+1)*100*factor()} PUNKTE</div><h2>${esc(q.text)}</h2><button id="reveal" class="quiet">Lösung anzeigen</button><p class="answer" hidden>${esc(q.answer)}</p><label style="margin-top:24px">Antwortendes Team<select id="answer-team"><option value="">Bitte Team wählen</option>${state.teams.map((t,k)=>`<option value="${k}" ${k===state.turn?'selected':''}>${esc(t.name)} (${t.score} Pkt.)</option>`).join('')}</select></label><div class="actions"><button id="correct">✓ Richtig · +${(j+1)*100*factor()}</button><button id="wrong" class="danger">✕ Falsch · −${(j+1)*50*factor()}</button></div><p class="hint">Die Teamreihenfolge läuft nach jeder Bewertung weiter. Eine andere Teamauswahl gilt nur für diese Frage. Die Bewertung schließt diese Frage ab. Bei Bedarf die letzte Änderung anschließend rückgängig machen.</p><button id="close" class="quiet">Zurück ohne Bewertung</button><button type="button" id="abort-question" class="quiet">Spiel abbrechen</button>`;dialog.querySelector('#abort-question').onclick=requestAbort;dialog.querySelector('#reveal').onclick=()=>{dialog.querySelector('.answer').hidden=false;dialog.querySelector('#reveal').hidden=true};dialog.querySelector('#close').onclick=()=>dialog.close();for(const [id,sign]of [['correct',1],['wrong',-1]])dialog.querySelector('#'+id).onclick=()=>{const selected=dialog.querySelector('select').value;if(selected==='')return notify('Bitte zuerst ein Team auswählen.');if(q.used)return;const team=+selected,delta=answerPoints((j+1)*100*factor(),sign===1),previous=state.teams[team].score,previousTurn=state.turn;adjustScore(state.teams[team],delta);q.used=true;state.turn=advanceTurn(state.turn,state.teams.length);state.history.push({team,previous,previousTurn,question:[i,j],label:`${state.teams[team].name}: ${delta>0?'+':''}${delta} Punkte · ${state.categories[i].name}`});save();dialog.close();render()};dialog.showModal()}
const teamDialog=document.querySelector('#team-manager');
let teamDraft=[];
function openTeamManager(){
 teamDraft=state.teams.map((t,source)=>({...t,source}));
 renderTeamManager();teamDialog.showModal();
}
function renderTeamManager(){
 teamDialog.innerHTML=`<h2 id="team-manager-title">Teams für den weiteren Spielverlauf</h2><p>Verbleibende Teams behalten ihre Punkte. Neue Teams starten mit 0 Punkten und werden hinten eingereiht. Entfernte Teams nehmen nicht mehr an der Siegerwertung teil.</p><p class="hint">Beim Speichern einer Teamänderung wird der bisherige Rückgängig-Verlauf abgeschlossen. Mindestens zwei Teams müssen bleiben.</p><div class="teams">${teamDraft.map((t,i)=>`<section class="panel"><label>Teamname<input data-roster-name="${i}" maxlength="60" value="${esc(t.name)}"></label><p>${t.score} Punkte${t.source===undefined?' · Neues Team':''}</p><button type="button" class="quiet" data-roster-remove="${i}" ${teamDraft.length<=2?'disabled':''}>Team entfernen</button></section>`).join('')}</div><p id="team-manager-error" role="alert" style="color:#ffb8c3"></p><div class="actions"><button type="button" id="roster-add" class="quiet">+ Team hinzufügen</button><button type="button" id="roster-cancel" class="quiet">Abbrechen</button><button type="button" id="roster-save">Änderungen speichern</button></div>`;
}
teamDialog.addEventListener('input',e=>{
 if(e.target.dataset.rosterName!==undefined)teamDraft[Number(e.target.dataset.rosterName)].name=e.target.value;
});
teamDialog.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.id==='roster-cancel'){teamDialog.close();return}
 if(button.id==='roster-add'){
  let n=1;while(teamDraft.some(t=>t.name.trim().toLowerCase()===`team ${n}`))n++;
  teamDraft.push({name:`Team ${n}`,score:0});renderTeamManager();return;
 }
 if(button.dataset.rosterRemove!==undefined&&teamDraft.length>2){teamDraft.splice(Number(button.dataset.rosterRemove),1);renderTeamManager();return}
 if(button.id==='roster-save'){
  try{applyTeamChanges(state,teamDraft);save();teamDialog.close();render();notify('Teams aktualisiert. Die Punkte der verbleibenden Teams bleiben erhalten.')}
  catch(err){teamDialog.querySelector('#team-manager-error').textContent=err.message}
 }
});
const abortDialog=document.querySelector('#abort-game');
function requestAbort(){if(!abortDialog.open)abortDialog.showModal()}
document.querySelector('#reset').onclick=requestAbort;
document.querySelector('#keep-playing').onclick=()=>abortDialog.close();
document.querySelector('#confirm-abort').onclick=()=>{
 if(dialog.open)dialog.close();
 if(teamDialog.open)teamDialog.close();
 abortDialog.close();
 state=fresh();save();render();
 window.scrollTo({top:0,behavior:'instant'});
 document.querySelector('h1').setAttribute('tabindex','-1');
 document.querySelector('h1').focus({preventScroll:true});
 notify('Spiel abgebrochen. Du kannst ein neues Spiel vorbereiten.');
};
render();

function downloadTemplate(){
 const url=URL.createObjectURL(new Blob([quizTemplate()],{type:'text/plain;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='Quizabend-Vorlage.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importQuiz(text){
 try{
  const categories=parseQuiz(text);
  if(state.categories.some(c=>c.name.trim()||c.questions.some(q=>q.text.trim()||q.answer.trim()))&&!confirm('Vorhandene Kategorien und Fragen durch den Import ersetzen?'))return;
  state.categories=categories;save();render();notify('Fünf Kategorien und 25 Fragen erfolgreich importiert.');
 }catch(err){document.querySelector('#import-error').textContent=err.message}
}
app.addEventListener('change',async e=>{
 if(e.target.id!=='quiz-file')return;
 const file=e.target.files[0];if(!file)return;
 try{importQuiz(await file.text())}catch{document.querySelector('#import-error').textContent='Datei konnte nicht gelesen werden. Bitte als UTF-8-TXT speichern.'}
 e.target.value='';
});
</script></body></html>
